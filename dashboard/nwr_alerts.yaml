# ══════════════════════════════════════════════════════════════════════════════
#  nwr_alerts.yaml — NWR Lovelace Dashboard
#  Repository: https://github.com/swise01/HA-NWR-SDR
#
#  REQUIRES: Mushroom (HACS) + card-mod (HACS)
#
#  Only two things to edit:
#    1. Search "← EDIT" — update station name and county/zone labels
#    2. If you're NWS API-only, the SDR section just shows "disabled"
#       — no other changes needed.
# ══════════════════════════════════════════════════════════════════════════════

title: NWR Weather Radio
views:

  # ════════════════════════════════════════════════════════════════
  #  TAB 1 — NWR  (live monitoring)
  # ════════════════════════════════════════════════════════════════
  - title: NWR
    icon: mdi:radio-tower
    path: nwr
    type: masonry
    cards:

      # ── Header ────────────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: NWR MONITORING SYSTEM
        secondary: >
          {{ states('input_text.nwr_station_name') }}  ·
          {{ states('input_select.nwr_wx_channel') }}  ·
          Parser: {{ states('sensor.nwr_parser_status_display') | upper }}
        icon: mdi:radio-tower
        icon_color: >
          {% if is_state('input_boolean.nwr_alert_active', 'on') %}red
          {% elif states('sensor.nwr_parser_status_display') == 'running' %}green
          {% else %}orange{% endif %}
        badge_icon: >
          {% if is_state('input_boolean.nwr_alert_active', 'on') %}mdi:alert{% endif %}
        badge_color: red
        card_mod:
          style: &header_style >
            ha-card { background:linear-gradient(90deg,#0d1520 0%,#111d2e 100%)
            !important; border:1px solid #1e3a5f !important; border-left:4px solid
            #2a7fff !important; border-radius:8px !important; padding:4px 0 !important; }
            .primary { font-family:'Courier New',monospace !important; font-size:14px
            !important; font-weight:700 !important; letter-spacing:3px !important;
            color:#4a9eff !important; }
            .secondary { font-family:'Courier New',monospace !important; font-size:12px
            !important; letter-spacing:1px !important; color:#5a7a9a !important; }

      # ── Alert banner (active) ──────────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.nwr_alert_active
            state: 'on'
        card:
          type: custom:mushroom-template-card
          primary: ⚠  {{ states('sensor.nwr_effective_headline') | upper | truncate(50) }}
          secondary: >
            {{ states('sensor.nwr_effective_area') | truncate(60) }}  ·
            {{ states('sensor.nwr_alert_duration_remaining') }}  ·
            CODE: {{ states('input_text.nwr_display_event_code') }}
          icon: mdi:alert-octagram
          icon_color: red
          card_mod:
            style: >
              @keyframes nwr-glow { 0%,100%{ box-shadow:0 0 18px #ff000066;
              border-color:#ff3333; } 50%{ box-shadow:0 0 36px #ff0000aa;
              border-color:#ff8888; } }
              ha-card { background:linear-gradient(135deg,#2a0000 0%,#1a0000 100%)
              !important; border:1px solid #ff3333 !important; border-left:6px solid
              #ff0000 !important; border-radius:8px !important;
              animation:nwr-glow 2s ease-in-out infinite !important; }
              .primary { font-family:'Courier New',monospace !important; font-size:18px
              !important; font-weight:700 !important; letter-spacing:2px !important;
              color:#ff4444 !important; }
              .secondary { font-family:'Courier New',monospace !important; font-size:12px
              !important; letter-spacing:1px !important; color:#ff9999 !important; }

      # ── All-clear banner ──────────────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.nwr_alert_active
            state: 'off'
        card:
          type: custom:mushroom-template-card
          primary: ALL CLEAR
          secondary: No active alerts · System monitoring normally
          icon: mdi:shield-check
          icon_color: green
          card_mod:
            style: >
              ha-card { background:linear-gradient(90deg,#071a07 0%,#0a1f0a 100%)
              !important; border:1px solid #1a4a1a !important; border-left:4px solid
              #00aa44 !important; border-radius:8px !important; }
              .primary { font-family:'Courier New',monospace !important; font-size:14px
              !important; font-weight:700 !important; letter-spacing:3px !important;
              color:#33cc66 !important; }
              .secondary { font-family:'Courier New',monospace !important; font-size:12px
              !important; letter-spacing:1px !important; color:#3a7a4a !important; }

      # ── System status ──────────────────────────────────────────
      - type: entities
        title: ■ SYSTEM STATUS
        show_header_toggle: false
        entities:
          - entity: sensor.nwr_parser_status_display
            name: Pi parser (SDR mode)
            icon: mdi:raspberry-pi
          - entity: input_boolean.nwr_alert_active
            name: Alert active
            icon: mdi:alert
          - entity: timer.nwr_alert
            name: Alert timer
            icon: mdi:timer-alert
          - entity: sensor.nwr_data_source
            name: Data source
            icon: mdi:check-network
          - entity: sensor.nws_active_alert_count
            name: NWS active alerts
            icon: mdi:alert-circle-outline
          - entity: sensor.nws_zone1_alert_count
            name: Zone 1 count           # ← EDIT: rename to your zone/county
            icon: mdi:map-marker
          - entity: sensor.nws_zone2_alert_count
            name: Zone 2 count           # ← EDIT: rename to your zone/county
            icon: mdi:map-marker
          - entity: sensor.nwr_eom_received
            name: Last EOM (SDR)
            icon: mdi:check-circle
          - entity: input_text.nwr_active_alerts
            name: Alert dict
            icon: mdi:format-list-bulleted
        card_mod:
          style: &blue_card >
            ha-card { background:#0d1520 !important; border:1px solid #1e3a5f
            !important; border-top:3px solid #2a7fff !important; border-radius:8px !important; }
            .card-header { font-family:'Courier New',monospace !important; font-size:12px
            !important; font-weight:700 !important; letter-spacing:2px !important;
            color:#4a9eff !important; padding-bottom:4px !important; }
            hui-generic-entity-row, hui-toggle-entity-row { font-family:'Courier
            New',monospace !important; font-size:13px !important; color:#8ab0cc !important;
            min-height:44px !important; }

      # ── Active alert detail (conditional) ─────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.nwr_alert_active
            state: 'on'
        card:
          type: entities
          title: ■ ACTIVE ALERT DETAIL
          show_header_toggle: false
          entities:
            - entity: sensor.nwr_data_source
              name: Source
              icon: mdi:check-network
            - entity: sensor.nwr_effective_headline
              name: Headline
              icon: mdi:bulletin-board
            - entity: sensor.nwr_effective_area
              name: Area
              icon: mdi:map-marker-radius
            - entity: sensor.nwr_effective_description
              name: Description
              icon: mdi:text-long
            - entity: sensor.nwr_effective_instruction
              name: Instructions
              icon: mdi:format-list-checks
            - entity: sensor.nwr_alert_duration_remaining
              name: Time remaining
              icon: mdi:timer
            - entity: sensor.nwr_tts_message
              name: TTS preview
              icon: mdi:text-to-speech
          card_mod:
            style: &orange_card >
              ha-card { background:#0d1520 !important; border:1px solid #1e3a5f !important;
              border-top:3px solid #ff4400 !important; border-radius:8px !important; }
              .card-header { font-family:'Courier New',monospace !important; font-size:12px
              !important; font-weight:700 !important; letter-spacing:2px !important;
              color:#ff6633 !important; padding-bottom:4px !important; }
              hui-generic-entity-row { font-family:'Courier New',monospace !important;
              font-size:12px !important; color:#8ab0cc !important; min-height:44px
              !important; white-space:normal !important; }

      # ── Active alert stack ─────────────────────────────────────
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.nwr_alert_active
            state: 'on'
        card:
          type: markdown
          title: ■ ACTIVE ALERT STACK
          content: >
            {% set tiers = {'TOR':1,'EWW':1,'FFW':1,'TSW':1,'NUW':1,'RHW':1,'HMW':1,'SPW':1,'EVI':1,'CDW':1,'VOW':1,'EQW':1,'LEW':1,'LAW':1,'CEM':1,'SVR':2,'BZW':2,'ISW':2,'HUW':2,'WSW':2,'FRW':2,'AVW':2,'SMW':2,'HWW':2,'FLW':2,'DSW':2,'EHW':2,'ECW':2,'TYW':2,'TOA':3,'SVA':3,'FFA':3,'FLA':3,'HUA':3,'WSA':3,'BZA':3,'AVA':3,'HWA':3,'TYA':3,'TSA':3,'EHA':3,'ECA':3,'FRA':3,'DBA':3,'SPS':4,'FLS':4,'FFS':4,'HLS':4,'MWS':4,'WIY':4,'WCY':4,'FZW':4,'HZW':4,'FZA':4,'HZA':4,'FWW':4,'DUY':4,'FOG':4,'SBY':4,'BHY':4,'LWY':4,'AQY':4,'ASY':4,'FWA':4,'RWT':5,'RMT':5,'DMO':5,'NMN':5,'ADR':5} %}
            {% set tlabel = {1:'⚠️ TIER 1 — IMMINENT THREAT',2:'🟠 TIER 2 — WARNING',3:'🟡 TIER 3 — WATCH',4:'🔵 TIER 4 — ADVISORY',5:'⚪ TIER 5 — TEST'} %}
            {% set raw = states('input_text.nwr_active_alerts') %}
            {% set d = raw | from_json if raw not in ('','unknown','unavailable','{}') else {} %}
            {% if d | length == 0 %}*No SAME-decoded alerts in stack (NWS API data shown above)*
            {% else %}
              {%- set ns = namespace(last_tier=0) %}
              {%- for t in [1,2,3,4,5] %}
                {%- for code, expiry in d.items() %}
                  {%- if tiers.get(code,4) == t %}
                    {%- if t != ns.last_tier %}
            **{{ tlabel.get(t,'TIER '~t) }}**
                      {%- set ns.last_tier = t %}
                    {%- endif %}
                    {%- set delta = ((expiry|as_datetime)-now()).total_seconds()|int %}
                    {%- set h=(delta//3600)|int %}{% set m=((delta%3600)//60)|int %}
            `{{ code }}` — **{{ (h~'h '~m~'m') if h>0 else (m~'m') }} remaining**
                  {%- endif %}
                {%- endfor %}
              {%- endfor %}
            {% endif %}

            ---
            [View all SAME event codes at weather.gov](https://www.weather.gov/nwr/eventcodes)
          card_mod:
            style: *orange_card

      # ── NWS live alert slots ───────────────────────────────────
      - type: entities
        title: ■ NWS ACTIVE ALERTS — YOUR ZONE(S)         # ← EDIT
        show_header_toggle: false
        entities:
          - type: section
            label: Polled from NWS API every 60 seconds
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_1
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_1'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_1','countdown') }}  ·
                {{ state_attr('sensor.nws_active_alert_slot_1','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_1','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_2
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_2'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_2','countdown') }}  ·
                {{ state_attr('sensor.nws_active_alert_slot_2','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_2','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_3
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_3'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_3','countdown') }}  ·
                {{ state_attr('sensor.nws_active_alert_slot_3','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_3','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_4
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_4'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_4','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_4','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_5
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_5'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_5','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: blue
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_1
                state: none
            row:
              type: section
              label: No active NWS alerts for your zones
        card_mod:
          style: *orange_card

      # ── Manual controls ────────────────────────────────────────
      - type: entities
        title: ■ CONTROLS
        show_header_toggle: false
        entities:
          - entity: input_boolean.nwr_on_demand_stream
            name: On-demand stream
            icon: mdi:play-circle
          - entity: input_boolean.nwr_weekly_test_mode
            name: Weekly test triggers full chain
            icon: mdi:calendar-check
          - entity: input_boolean.nwr_notify_tier5
            name: Notify on tests
            icon: mdi:flask
        card_mod:
          style: *blue_card


  # ════════════════════════════════════════════════════════════════
  #  TAB 2 — DETAILS
  # ════════════════════════════════════════════════════════════════
  - title: Details
    icon: mdi:weather-cloudy-alert
    path: details
    type: masonry
    cards:

      - type: custom:mushroom-template-card
        primary: >
          {% if is_state('input_boolean.nwr_alert_active','on') %}⚠ {{
          states('sensor.nwr_effective_headline') | upper | truncate(40)
          }}{% else %}✓ ALL CLEAR{% endif %}
        secondary: >
          {% if is_state('input_boolean.nwr_alert_active','on') %}{{
          states('sensor.nwr_effective_area') | truncate(50) }}  ·  {{
          states('sensor.nwr_alert_duration_remaining') }}  ·  {{
          states('sensor.nwr_data_source') }}{% else %}
          {{ states('input_text.nwr_station_name') }}  ·  {{
          states('input_select.nwr_wx_channel') }}  ·  Parser: {{
          states('sensor.nwr_parser_status_display') | upper }}{% endif %}
        icon: >
          {% if is_state('input_boolean.nwr_alert_active','on')
          %}mdi:alert-octagram{% else %}mdi:shield-check{% endif %}
        icon_color: >
          {% if is_state('input_boolean.nwr_alert_active','on') %}red{% else %}green{% endif %}
        card_mod:
          style: >
            ha-card {
              background: {% if is_state('input_boolean.nwr_alert_active','on') %}linear-gradient(135deg,#2a0000 0%,#1a0000 100%){% else %}linear-gradient(90deg,#071a07 0%,#0a1f0a 100%){% endif %} !important;
              border:2px solid {% if is_state('input_boolean.nwr_alert_active','on') %}#ff3333{% else %}#1a4a1a{% endif %} !important;
              border-left:6px solid {% if is_state('input_boolean.nwr_alert_active','on') %}#ff0000{% else %}#00aa44{% endif %} !important;
              border-radius:8px !important; padding:8px 0 !important;
            }
            .primary { font-family:'Courier New',monospace !important; font-size:16px
            !important; font-weight:700 !important; letter-spacing:2px !important;
            color:{% if is_state('input_boolean.nwr_alert_active','on') %}#ff4444{% else %}#33cc66{% endif %} !important; }
            .secondary { font-family:'Courier New',monospace !important; font-size:12px
            !important; color:{% if is_state('input_boolean.nwr_alert_active','on') %}#ff9999{% else %}#3a7a4a{% endif %} !important; }

      - type: glance
        title: ■ SYSTEM HEALTH
        entities:
          - entity: sensor.nwr_parser_status_display
            name: Parser
            icon: mdi:raspberry-pi
          - entity: input_boolean.nwr_alert_active
            name: Alert
            icon: mdi:alert
          - entity: timer.nwr_alert
            name: Timer
            icon: mdi:timer-alert
          - entity: sensor.nws_active_alert_count
            name: NWS
            icon: mdi:weather-cloudy-alert
          - entity: sensor.nwr_data_source
            name: Source
            icon: mdi:check-network
        card_mod:
          style: *blue_card

      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.nwr_alert_active
            state: 'on'
        card:
          type: markdown
          title: ■ ALERT DETAIL
          content: |
            **Source:** {{ states('sensor.nwr_data_source') }}
            **Code:** {{ states('input_text.nwr_display_event_code') }} — [Look up this code](https://www.weather.gov/nwr/eventcodes)
            **Headline:** {{ states('sensor.nwr_effective_headline') }}
            **Area:** {{ states('sensor.nwr_effective_area') }}
            **Expires:** {{ states('input_text.nwr_cached_expiry') }}
            **Description:** {{ states('sensor.nwr_effective_description') }}
            **Instructions:** {{ states('sensor.nwr_effective_instruction') }}
          card_mod:
            style: *orange_card

      - type: entities
        title: ■ NWS LIVE ALERTS
        show_header_toggle: false
        entities:
          - type: section
            label: YOUR ZONE(S) — updates every 60s    # ← EDIT
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_1
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_1'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_1','countdown') }}  ·
                {{ state_attr('sensor.nws_active_alert_slot_1','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_1','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_2
                state_not: none
            row:
              type: custom:mushroom-template-card
              primary: '{{ states(''sensor.nws_active_alert_slot_2'') | upper }}'
              secondary: >-
                {{ state_attr('sensor.nws_active_alert_slot_2','countdown') }}  ·
                {{ state_attr('sensor.nws_active_alert_slot_2','area') | truncate(60) }}
              icon: mdi:alert-circle
              icon_color: >
                {% set s = state_attr('sensor.nws_active_alert_slot_2','severity') | default('') %}
                {% if s=='Extreme' %}red{% elif s=='Severe' %}orange{% elif s=='Moderate' %}amber{% else %}blue{% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nws_active_alert_slot_1
                state: none
            row:
              type: section
              label: No active NWS alerts
        card_mod:
          style: *orange_card


  # ════════════════════════════════════════════════════════════════
  #  TAB 3 — SETTINGS
  # ════════════════════════════════════════════════════════════════
  - title: Settings
    icon: mdi:bell-cog-outline
    path: settings
    type: masonry
    cards:

      - type: custom:mushroom-template-card
        primary: NWR SETTINGS
        secondary: >
          {{ states('input_text.nwr_station_name') }}  ·
          Notification, audio and mode configuration
        icon: mdi:cog
        icon_color: blue
        card_mod:
          style: *header_style

      # ── Station & mode ─────────────────────────────────────────
      - type: entities
        title: ■ STATION & MODE
        show_header_toggle: false
        entities:
          - entity: input_text.nwr_station_name
            name: Station name
            icon: mdi:radio-tower
          - entity: input_select.nwr_wx_channel
            name: WX channel
            icon: mdi:radio
          - type: section
            label: Find your station and channel at weather.gov/nwr/station_listing
          - entity: input_boolean.nwr_sdr_mode_enabled
            name: SDR mode (Pi + RTL-SDR)
            icon: mdi:radio-tower
          - entity: sensor.nwr_parser_status_display
            name: Parser status
            icon: mdi:raspberry-pi
          - entity: sensor.nwr_heartbeat
            name: Last heartbeat
            icon: mdi:heart-pulse
        card_mod:
          style: *blue_card

      # ── Notification tiers ─────────────────────────────────────
      - type: entities
        title: ■ NOTIFICATION TIERS
        show_header_toggle: false
        entities:
          - type: section
            label: TIER 1 — IMMINENT THREAT  [ ALWAYS ON — CANNOT DISABLE ]
          - type: section
            label: TOR · EWW · FFW · TSW · NUW · RHW · HMW · SPW · EVI · CDW · VOW · EQW · LEW · LAW · CEM
          - type: section
            label: TIER 2 — WARNING
          - entity: input_boolean.nwr_notify_tier2
            name: Enable tier 2 notifications
            icon: mdi:alert-circle
          - entity: input_select.nwr_notify_sound_tier2
            name: Sound
            icon: mdi:bell
          - type: section
            label: TIER 3 — WATCH
          - entity: input_boolean.nwr_notify_tier3
            name: Enable tier 3 notifications
            icon: mdi:alert
          - entity: input_select.nwr_notify_sound_tier3
            name: Sound
            icon: mdi:bell-outline
          - type: section
            label: TIER 4 — ADVISORY / STATEMENT
          - entity: input_boolean.nwr_notify_tier4
            name: Enable tier 4 notifications
            icon: mdi:information
          - entity: input_boolean.nwr_tier4_critical
            name: Tier 4 critical push
            icon: mdi:bell-alert
          - entity: input_select.nwr_notify_sound_tier4
            name: Sound
            icon: mdi:bell-off-outline
          - type: section
            label: TIER 5 — TEST
          - entity: input_boolean.nwr_notify_tier5
            name: Notify on tests
            icon: mdi:flask
          - entity: input_boolean.nwr_weekly_test_mode
            name: Weekly test triggers full chain
            icon: mdi:calendar-check
          - type: section
            label: "Full SAME code list: weather.gov/nwr/eventcodes"
        card_mod:
          style: >
            ha-card { background:#0d1520 !important; border:1px solid #1e3a5f
            !important; border-top:3px solid #ffaa00 !important; border-radius:8px !important; }
            .card-header { font-family:'Courier New',monospace !important; font-size:12px
            !important; font-weight:700 !important; letter-spacing:2px !important;
            color:#ffaa00 !important; padding-bottom:4px !important; }
            .section-label { font-family:'Courier New',monospace !important; font-size:11px
