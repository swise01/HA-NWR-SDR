# HA-NWR-SDR v2 Home Assistant bridge package
#
# This package intentionally avoids house-specific actions. It creates common
# entities and fires standard Home Assistant events. Users can build their own
# automations from those events.
#
# Events fired:
#   nwr_same_alert_received
#   nwr_eom_received
#   nwr_alert_expired
#
# Required edit:
#   Replace YOUR_ZONE_1,YOUR_ZONE_2 in the NWS REST URL, or remove the rest:
#   block if you only want SAME/MQTT data.

mqtt:
  sensor:
    - name: "NWR Parser Status"
      unique_id: nwr_parser_status
      state_topic: "nwr/status"
      icon: mdi:radio-tower

    - name: "NWR Audio URL"
      unique_id: nwr_audio_url
      state_topic: "nwr/audio/url"
      icon: mdi:volume-source

    - name: "NWR Last SAME Alert"
      unique_id: nwr_last_same_alert
      state_topic: "nwr/alert/same"
      value_template: "{{ value_json.event_code | default('none') }}"
      json_attributes_topic: "nwr/alert/same"
      json_attributes_template: "{{ value_json | tojson }}"
      icon: mdi:alert-decagram

    - name: "NWR EOM Received"
      unique_id: nwr_eom_received
      state_topic: "nwr/alert/eom"
      value_template: "{{ value_json.eom_utc | default('') }}"
      device_class: timestamp
      icon: mdi:check-circle

rest:
  - resource: "https://api.weather.gov/alerts/active?zone=YOUR_ZONE_1,YOUR_ZONE_2"
    scan_interval: 60
    headers:
      User-Agent: "HA-NWR-SDR v2, https://github.com/swise01/HA-NWR-SDR"
      Accept: "application/geo+json"
    sensor:
      - name: "NWS Active Alert Count"
        unique_id: nws_active_alert_count
        value_template: "{{ value_json.features | length }}"
      - name: "NWS Alert Headline"
        unique_id: nws_alert_headline
        value_template: >
          {% set alerts = value_json.features %}
          {% if alerts | length > 0 %}
            {{ alerts[0].properties.headline | default('No headline') }}
          {% else %}
            No active alerts
          {% endif %}
      - name: "NWS Alert Description"
        unique_id: nws_alert_description
        value_template: >
          {% set alerts = value_json.features %}
          {% if alerts | length > 0 %}
            {{ alerts[0].properties.description | default('') | truncate(255) }}
          {% else %}
            No active alerts
          {% endif %}
        json_attributes_path: "$.features[0].properties"
        json_attributes:
          - headline
          - description
          - instruction
          - severity
          - certainty
          - urgency
          - event
          - areaDesc
          - effective
          - expires
          - senderName

input_boolean:
  nwr_alert_active:
    name: "NWR Alert Active"
    icon: mdi:alert-octagram

input_text:
  nwr_display_event_code:
    name: "NWR Display Event Code"
    initial: ""
    max: 10
  nwr_display_event_name:
    name: "NWR Display Event Name"
    initial: ""
    max: 100
  nwr_display_county_codes:
    name: "NWR Display County Codes"
    initial: ""
    max: 200
  nwr_display_severity_label:
    name: "NWR Display Severity Label"
    initial: ""
    max: 30
  nwr_cached_expiry:
    name: "NWR Cached Alert Expiry"
    initial: ""
    max: 50
  nwr_active_alerts:
    name: "NWR Active Alerts Dict"
    initial: "{}"
    max: 255

timer:
  nwr_alert:
    name: "NWR Alert Timer"
    icon: mdi:timer-alert
    restore: true

template:
  - sensor:
      - name: "NWR Alert Duration Remaining"
        unique_id: nwr_alert_duration_remaining
        state: >
          {% if not is_state('input_boolean.nwr_alert_active', 'on') %}
            No active alert
          {% elif is_state('timer.nwr_alert', 'idle') %}
            No active alert
          {% else %}
            {% set remaining = state_attr('timer.nwr_alert', 'remaining') %}
            {{ remaining if remaining else 'Active' }}
          {% endif %}

      - name: "NWR Current Event Code"
        unique_id: nwr_current_event_code
        state: "{{ states('input_text.nwr_display_event_code') }}"

      - name: "NWR Current Event Name"
        unique_id: nwr_current_event_name
        state: "{{ states('input_text.nwr_display_event_name') }}"

      - name: "NWR Current Severity"
        unique_id: nwr_current_severity
        state: "{{ states('input_text.nwr_display_severity_label') }}"

      - name: "NWR Current County Codes"
        unique_id: nwr_current_county_codes
        state: "{{ states('input_text.nwr_display_county_codes') }}"

automation:
  - id: nwr_alert_dispatch
    alias: "NWR - Alert dispatch"
    mode: queued
    max: 5
    trigger:
      - platform: mqtt
        topic: "nwr/alert/same"
    variables:
      event_code: "{{ trigger.payload_json.event_code | default('') }}"
      counties: "{{ trigger.payload_json.counties | default([]) }}"
      valid_secs: "{{ trigger.payload_json.valid_seconds | default(3600) | int }}"
      received_utc: "{{ trigger.payload_json.received_utc | default('') }}"
      issue_utc: "{{ trigger.payload_json.issue_utc | default('') }}"
      issue_expiry_utc: >
        {% set ie = trigger.payload_json.issue_expiry_utc | default('') %}
        {% if ie %}
          {{ ie }}
        {% elif received_utc %}
          {{ ((received_utc | as_datetime) + timedelta(seconds=valid_secs)).isoformat() }}
        {% else %}
          {{ (now() + timedelta(seconds=valid_secs)).isoformat() }}
        {% endif %}
      true_remaining_secs: >
        {% set trs = trigger.payload_json.true_remaining_secs | default(-1) | int %}
        {% if trs >= 0 %}
          {{ trs }}
        {% else %}
          {{ valid_secs }}
        {% endif %}
      is_stale: "{{ issue_expiry_utc != '' and (issue_expiry_utc | as_datetime) < now() }}"
      severity: >
        {% set tiers = {
          'TOR':1,'EWW':1,'FFW':1,'TSW':1,'NUW':1,'RHW':1,'HMW':1,
          'SPW':1,'EVI':1,'CDW':1,'VOW':1,'EQW':1,'LEW':1,'LAW':1,
          'CEM':1,'SVR':2,'BZW':2,'ISW':2,'HUW':2,'WSW':2,'FRW':2,
          'AVW':2,'SMW':2,'HWW':2,'FLW':2,'DSW':2,'EHW':2,'ECW':2,
          'TYW':2,'TOA':3,'SVA':3,'FFA':3,'FLA':3,'HUA':3,'WSA':3,
          'BZA':3,'AVA':3,'HWA':3,'TYA':3,'TSA':3,'EHA':3,'ECA':3,
          'FRA':3,'DBA':3,'SPS':4,'FLS':4,'FFS':4,'HLS':4,'MWS':4,
          'WIY':4,'WCY':4,'FZW':4,'HZW':4,'FZA':4,'HZA':4,'FWW':4,
          'DUY':4,'FOG':4,'SBY':4,'BHY':4,'LWY':4,'AQY':4,'ASY':4,
          'FWA':4,'RWT':5,'RMT':5,'DMO':5,'NMN':5,'ADR':5
        } %}
        {{ tiers.get(event_code, 4) }}
      event_name: >
        {% set names = {
          'TOR':'Tornado Warning','EWW':'Extreme Wind Warning',
          'FFW':'Flash Flood Warning','TSW':'Tsunami Warning',
          'NUW':'Nuclear Power Plant Warning','RHW':'Radiological Hazard Warning',
          'HMW':'Hazardous Materials Warning','SPW':'Shelter-in-Place Warning',
          'EVI':'Evacuation Immediate','CDW':'Civil Danger Warning',
          'VOW':'Volcano Warning','EQW':'Earthquake Warning',
          'LEW':'Law Enforcement Warning','LAW':'Local Area Emergency',
          'CEM':'Civil Emergency Message','SVR':'Severe Thunderstorm Warning',
          'BZW':'Blizzard Warning','ISW':'Ice Storm Warning',
          'HUW':'Hurricane Warning','WSW':'Winter Storm Warning',
          'FRW':'Fire Warning','AVW':'Avalanche Warning',
          'SMW':'Special Marine Warning','HWW':'High Wind Warning',
          'FLW':'Flood Warning','DSW':'Dust Storm Warning',
          'EHW':'Extreme Heat Warning','ECW':'Extreme Cold Warning',
          'TYW':'Typhoon Warning','TOA':'Tornado Watch',
          'SVA':'Severe Thunderstorm Watch','FFA':'Flash Flood Watch',
          'FLA':'Flood Watch','HUA':'Hurricane Watch',
          'WSA':'Winter Storm Watch','SPS':'Special Weather Statement',
          'FLS':'Flood Statement','FFS':'Flash Flood Statement',
          'HLS':'Hurricane Local Statement','RWT':'Required Weekly Test',
          'RMT':'Required Monthly Test','DMO':'Practice/Demo Warning',
          'NMN':'Network Message Notification','ADR':'Administrative Message'
        } %}
        {{ names.get(event_code, 'Unknown Alert (' ~ event_code ~ ')') }}
      severity_label: >
        {% if severity | int == 1 %}Imminent Threat
        {% elif severity | int == 2 %}Warning
        {% elif severity | int == 3 %}Watch
        {% elif severity | int == 4 %}Advisory
        {% elif severity | int == 5 %}Test
        {% else %}None{% endif %}
      county_codes: "{{ counties | join(', ') }}"
    action:
      - condition: template
        value_template: "{{ not is_stale }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_event_code
        data:
          value: "{{ event_code }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_event_name
        data:
          value: "{{ event_name }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_county_codes
        data:
          value: "{{ county_codes }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_severity_label
        data:
          value: "{{ severity_label }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_cached_expiry
        data:
          value: "{{ issue_expiry_utc }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_active_alerts
        data:
          value: >
            {% set raw = states('input_text.nwr_active_alerts') %}
            {% set d = raw | from_json if raw not in ('', 'unknown', 'unavailable', '{}') else {} %}
            {% set ns = namespace(v={}) %}
            {% for k, v in d.items() %}
              {% set ns.v = dict(ns.v, **{k: v}) %}
            {% endfor %}
            {% set ns.v = dict(ns.v, **{event_code: issue_expiry_utc}) %}
            {{ ns.v | to_json }}

      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.nwr_alert_active
      - service: timer.start
        target:
          entity_id: timer.nwr_alert
        data:
          duration: "{{ true_remaining_secs }}"
      - event: nwr_same_alert_received
        event_data:
          event_code: "{{ event_code }}"
          event_name: "{{ event_name }}"
          severity: "{{ severity | int }}"
          severity_label: "{{ severity_label }}"
          counties: "{{ counties }}"
          county_codes: "{{ county_codes }}"
          issue_utc: "{{ issue_utc }}"
          issue_expiry_utc: "{{ issue_expiry_utc }}"
          true_remaining_secs: "{{ true_remaining_secs | int }}"
          raw: "{{ trigger.payload_json.raw | default('') }}"

  - id: nwr_eom_received
    alias: "NWR - EOM received"
    trigger:
      - platform: mqtt
        topic: "nwr/alert/eom"
    action:
      - event: nwr_eom_received
        event_data:
          eom_utc: "{{ trigger.payload_json.eom_utc | default(now().isoformat()) }}"

  - id: nwr_alert_expired
    alias: "NWR - Alert expired"
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.nwr_alert
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.nwr_alert_active
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_active_alerts
        data:
          value: "{}"
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_event_code
        data:
          value: ""
      - service: input_text.set_value
        target:
          entity_id: input_text.nwr_display_event_name
        data:
          value: ""
      - event: nwr_alert_expired
        event_data:
          expired_at: "{{ now().isoformat() }}"
