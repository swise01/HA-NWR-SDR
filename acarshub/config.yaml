name: ACARS Hub
version: "0.1.1"
slug: acarshub
description: Local ACARS Hub dashboard for VDL2 messages received by the NUT Pi
url: "https://github.com/swise01/HA-NWR-SDR/tree/main/acarshub"
arch:
  - amd64
startup: services
boot: auto
init: false
ports:
  80/tcp: 8098
  5555/udp: 5555
ports_description:
  80/tcp: ACARS Hub web UI
  5555/udp: VDLM2 JSON input from dumpvdl2
webui: "http://[HOST]:[PORT:80]"
