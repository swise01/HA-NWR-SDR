name: Pacefinder
version: "0.1.0"
slug: pacefinder
description: Local Pacefinder Forza telemetry recorder and web dashboard
url: https://github.com/swise01/HA-NWR-SDR/tree/main/pacefinder
arch:
  - amd64
startup: services
boot: manual
init: false
host_network: true
ports:
  8000/tcp: 8000
  8000/udp: 8000
ports_description:
  8000/tcp: Pacefinder web UI
  8000/udp: Forwarded Forza telemetry input
map:
  - type: addon_config
    read_only: false
options:
  web_port: 8000
  udp_port: 8000
  storage_path: /data/pacefinder
schema:
  web_port: port
  udp_port: port
  storage_path: str
webui: http://[HOST]:[PORT:8000]
